---
deployment:
  tasks:
    - export DEPLOYPATH=/home/qbpxqy9q9gzc/aram-web
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp .env.example $DEPLOYPATH/.env.example
    - /bin/mkdir -p $DEPLOYPATH/storage/framework/sessions $DEPLOYPATH/storage/framework/views $DEPLOYPATH/storage/framework/cache/data $DEPLOYPATH/storage/logs $DEPLOYPATH/storage/app/public $DEPLOYPATH/storage/app/private $DEPLOYPATH/bootstrap/cache
    - /bin/chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache
    - test -f $DEPLOYPATH/.env || /bin/cp $DEPLOYPATH/.env.example $DEPLOYPATH/.env
    - test -f $DEPLOYPATH/database/database.sqlite || /bin/touch $DEPLOYPATH/database/database.sqlite
    - cd $DEPLOYPATH && (grep -q '^APP_KEY=$' .env && php artisan key:generate --force || true)
    - cd $DEPLOYPATH && php artisan migrate --force
    - cd $DEPLOYPATH && (test -L public/storage || php artisan storage:link)
    # Backfill WebP derivatives for images uploaded before the resizing feature.
    # This is a one-off catch-up: new uploads build their own on save.
    #
    # Runs to completion because there is no shell access on this host to finish
    # the job by hand. It is safe to let it run long: the command skips images
    # that already have their derivatives, so if the host cuts it off partway,
    # simply deploying again continues from where it stopped.
    #
    # Non-fatal on purpose — a failed backfill still leaves the site correct (it
    # falls back to the originals) and must not block the rest of the deploy.
    # Its output stays visible in the cPanel deploy log.
    - cd $DEPLOYPATH && (php artisan projects:thumbs || true)
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    # ------------------------------------------------------------------
    #  ERP
    #
    #  A second Laravel application, in erp/, reached at /erp through the
    #  front controller in public/erp. It keeps its own .env, its own
    #  database and its own caches, so every step the site needs it needs
    #  too — and it is installed by the same copy, since this host has no
    #  Composer and no npm.
    #
    #  Last on purpose: the public site is already deployed and cached by
    #  this point, so nothing here can take the site down with it.
    # ------------------------------------------------------------------
    - /bin/mkdir -p $DEPLOYPATH/erp/storage/framework/sessions $DEPLOYPATH/erp/storage/framework/views $DEPLOYPATH/erp/storage/framework/cache/data $DEPLOYPATH/erp/storage/logs $DEPLOYPATH/erp/storage/app/public $DEPLOYPATH/erp/storage/app/private $DEPLOYPATH/erp/bootstrap/cache
    - /bin/chmod -R 775 $DEPLOYPATH/erp/storage $DEPLOYPATH/erp/bootstrap/cache
    - test -f $DEPLOYPATH/erp/.env || /bin/cp $DEPLOYPATH/erp/.env.example $DEPLOYPATH/erp/.env
    - test -f $DEPLOYPATH/erp/database/database.sqlite || /bin/touch $DEPLOYPATH/erp/database/database.sqlite
    # The template leaves a comment after APP_KEY=, so the pattern has to
    # allow for one; matching only '^APP_KEY=$' would silently skip this
    # and leave the application with no key at all.
    - cd $DEPLOYPATH/erp && (grep -qE '^APP_KEY=[[:space:]]*(#.*)?$' .env && php artisan key:generate --force || true)
    - cd $DEPLOYPATH/erp && php artisan migrate --force
    - cd $DEPLOYPATH/erp && (test -L ../public/erp/storage || php artisan storage:link)
    # Seeds reference data into an empty database and creates the account
    # named by ERP_ADMIN_EMAIL. Safe to repeat; does nothing once the ERP
    # is running and the admin credentials have been cleared from .env.
    - cd $DEPLOYPATH/erp && php artisan erp:provision
    - cd $DEPLOYPATH/erp && php artisan config:cache
    - cd $DEPLOYPATH/erp && php artisan route:cache
    - cd $DEPLOYPATH/erp && php artisan view:cache
